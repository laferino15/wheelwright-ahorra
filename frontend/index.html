<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheelwright Ahorra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado y Banner (Imagen 1: Wheelwright Ahorra) -->
  <header class="top-nav">
    <div class="logo">Wheelwright Ahorra</div>
    <input type="text" class="search-bar" placeholder="Buscar productos...">
    <nav class="user-menu">
      <span>Inicio</span>
      <span>Comercios</span>
      <span class="cart-icon">🛒 0</span>
    </nav>
  </header>

  <section class="hero-banner">
    <div class="hero-content">
      <h1>Tu supermercado local en un solo lugar</h1>
      <p>Productos frescos, comercios de confianza y la mejor atención en Wheelwright.</p>
      <button class="btn-naranja">Comprar ahora ></button>
    </div>
  </section>

  <!-- Grilla de Categorías Dinámica (Imagen 2: Dom's Go) -->
  <section class="categorias-grid">
    <div class="card-cat doble-alto" style="background-color: #ffe8e8;">
      <h2>Carnicería y Parrilla</h2>
      <button>Ver cortes</button>
      <!-- <img src="carne.png" class="img-fondo"> -->
    </div>
    <div class="card-cat" style="background-color: #e8f4ff;">
      <h2>Panadería</h2>
      <button>Comprar</button>
    </div>
    <div class="card-cat doble-ancho" style="background-color: #f1f8e9;">
      <h2>Huerta Express</h2>
      <button>Ver frescos</button>
    </div>
    <div class="card-cat" style="background-color: #fff0d4;">
      <h2>Ferretería</h2>
      <button>Explorar</button>
    </div>
  </section>

  <!-- Productos Destacados (Imagen 1: Wheelwright Ahorra) -->
  <section class="productos-destacados">
    <h2 class="section-title">⭐ Productos destacados</h2>
    <div class="carrusel-productos">
      <div class="card-producto">
        <span class="badge-oferta">Oferta</span>
        <!-- <img src="manzanas.jpg" alt="Manzanas"> -->
        <h3>Manzanas</h3>
        <p class="precio">$1.200 <del>$1.500</del></p>
        <button class="btn-add">🛒</button>
      </div>
      <div class="card-producto">
        <h3>Pan Casero</h3>
        <p class="precio">$1.500</p>
        <button class="btn-add">🛒</button>
      </div>
    </div>
  </section>

</body>
</html>
